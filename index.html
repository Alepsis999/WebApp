        // Función para construir dataset combinado
        function construirDatasetCompleto() {
            let dataset = [...datosEntrenamiento];
            
            // Agregar variaciones de groserías
            diccionario.gros_Graves.forEach(palabra => {
                if (Math.random() > 0.7) {
                    dataset.push({ text: `eres un ${palabra}`, label: 1 });
                }
            });
            
            // Agregar combinaciones educadas
            diccionario.pos_Saludos.forEach(saludo => {
                diccionario.pos_Educacion.forEach(edu => {
                    if (Math.random() > 0.9) {
                        dataset.push({ text: `${saludo} ${edu}`, label: 0 });
                    }
                });
            });
            
            return dataset;
        }

        function procesarDatos() {
            let palabrasUnicas = new Set();
            const datasetCompleto = construirDatasetCompleto();
            
            datasetCompleto.forEach(d => {
                const palabras = d.text.toLowerCase().split(/[\s.,!?]+/).filter(p => p.length > 0);
                palabras.forEach(p => palabrasUnicas.add(p));
            });
            
            // Combinar todos los diccionarios
            Object.values(diccionario).forEach(categoria => {
                if (Array.isArray(categoria)) {
                    categoria.forEach(palabra => palabrasUnicas.add(palabra.toLowerCase()));
                }
            });
            
            let i = 1;
            palabrasUnicas.forEach(word => { 
                vocabulario[word] = i++; 
            });
            
            console.log("Vocabulario creado con", Object.keys(vocabulario).length, "palabras únicas");
            return datasetCompleto;
        }

        function textoATensor(texto) {
            const palabras = texto.toLowerCase()
                .replace(/[^\w\sáéíóúüñ.,!?]/gi, '')
                .split(/[\s.,!?]+/)
                .filter(p => p.length > 0);
            
            const secuencia = palabras.map(p => vocabulario[p] || 0);
            while (secuencia.length < maxLongitud) secuencia.push(0);
            return tf.tensor2d([secuencia.slice(0, maxLongitud)]);
        }

                contextoNegativo: false,
                palabrasPositivas: [],
                puntajeContextual: 0,
                recomendacion: ""
            };
            
            const textoLimpio = texto.toLowerCase();
            const palabras = textoLimpio.split(/[\s.,!?]+/).filter(p => p.length > 0);
            
            // Capa 1: Detección directa de palabras graves
            palabras.forEach(palabra => {
                if (diccionario.gros_Graves.some(g => palabra.includes(g) || g.includes(palabra))) {
                    resultado.groseriasGraves.push(palabra);
                }
                if (diccionario.gros_Moderadas.some(g => palabra.includes(g) || g.includes(palabra))) {
                    resultado.groseriasModeradas.push(palabra);
                }
                if (diccionario.gros_Regionalismos.some(g => palabra.includes(g) || g.includes(palabra))) {
                    resultado.groseriasModeradas.push(palabra);
                }
                if (diccionario.gros_Insultos.some(g => palabra.includes(g) || g.includes(palabra))) {
                    resultado.insultos.push(palabra);
                }
            });

                    diccionario.pos_Colaboracion.some(p => palabra.includes(p) || p.includes(palabra))) {
                    resultado.palabrasPositivas.push(palabra);
                }
            });

                /\beres un?\b.*\b(inútil|idiota|estúpido|imbécil)\b/i,
                /\b(vete|lárgate|salte)\b.*\b(a la|al)\b/i,

            ];

                /\b(por favor|porfavor)\b/i,
                /\b(gracias|agradecido|agradezco)\b/i,
                /\b(disculpe|perdón|con permiso)\b/i,

                /\b(necesito|quisiera).*\b(ayuda|asistencia)\b/i,
                /\b(excelente|buen|magnífico).*\b(trabajo|esfuerzo)\b/i
            ];
            
            let negativos = 0;
            let positivos = 0;
            
            patronesNegativos.forEach(patron => {
                if (patron.test(texto)) negativos++;
            });
            
            patronesPositivos.forEach(patron => {
                if (patron.test(texto)) positivos++;
            });
            
            resultado.puntajeContextual = positivos > negativos ? positivos / (positivos + negativos || 1) : 0;
            resultado.contextoNegativo = negativos > positivos;
            
            // Recomendación basada en análisis
            if (resultado.groseriasGraves.length > 0) {
                resultado.recomendacion = "Lenguaje muy ofensivo detectado. Se recomienda revisar el vocabulario.";
            } else if (resultado.insultos.length > 0) {
                resultado.recomendacion = "Insultos detectados. Considera expresar desacuerdos de forma respetuosa.";
            } else if (resultado.palabrasPositivas.length > 3) {
                resultado.recomendacion = "Excelente uso de lenguaje educado y respetuoso.";
            }
            
            return resultado;
        }

        async function entrenarModelo() {
            document.getElementById("status-msg").innerHTML = 
                "🧠 Procesando vocabulario y entrenando modelo...";
            
            const datasetCompleto = procesarDatos();
            
            const inputs = datasetCompleto.map(d => {
                const seq = d.text.toLowerCase()
                    .split(/[\s.,!?]+/)
                    .filter(p => p.length > 0)
                    .map(p => vocabulario[p] || 0);
                while (seq.length < maxLongitud) seq.push(0);
                return seq.slice(0, maxLongitud);
            });
            
            const labels = datasetCompleto.map(d => d.label);

            const xs = tf.tensor2d(inputs);
            const ys = tf.tensor2d(labels, [labels.length, 1]);

            model = tf.sequential();
            
            // Arquitectura mejorada
            model.add(tf.layers.embedding({
                inputDim: Object.keys(vocabulario).length + 1,
                outputDim: 32,
                inputLength: maxLongitud,
                maskZero: true
            }));
            
            model.add(tf.layers.bidirectional({
                layer: tf.layers.lstm({ units: 64, returnSequences: false }),
                mergeMode: 'concat'
            }));
            
            model.add(tf.layers.dense({ units: 32, activation: 'relu' }));
            model.add(tf.layers.dropout({ rate: 0.3 }));
            model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
            model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));

            model.compile({
                optimizer: tf.train.adam(0.001),
                loss: 'binaryCrossentropy',
                metrics: ['accuracy']
            });

            // Entrenamiento con callback de progreso
            const statusMsg = document.getElementById("status-msg");
            
            await model.fit(xs, ys, { 
                epochs: 60,
                batchSize: 8,
                validationSplit: 0.2,
                callbacks: {
                    onEpochEnd: (epoch, logs) => {
                        const progress = ((epoch + 1) / 60 * 100).toFixed(0);
                        statusMsg.innerHTML = 
                            `🧠 Entrenando modelo... ${progress}%<br>
                             Precisión: ${logs.acc ? (logs.acc * 100).toFixed(1) : '0'}%`;
                    }
                }
            });
            
            // Habilitar interfaz
            document.getElementById("status-msg").style.display = 'none';
            document.getElementById("texto").disabled = false;
            document.getElementById("btn-send").disabled = false;
            
            addMessage("✅ **Sistema listo** - Detector V7 activado", "bot");
            addMessage("🎯 **Características:**", "bot");
            addMessage("• 500+ palabras y expresiones analizadas", "bot");
            addMessage("• 4 capas de detección contextual", "bot");
            addMessage("• 3 modos de sensibilidad", "bot");
            addMessage("• Análisis en tiempo real", "bot");
            
            mostrarEstadisticas();
        }

        // FUNCIONES DE INTERFAZ
        function addMessage(text, sender, data = null) {
            const div = document.createElement("div");
            div.className = `message-bubble ${sender === "user" ? "message-user" : "message-bot"}`;
            
            if (sender === "bot" && data) {
                let contenido = `<div>${text}</div>`;
                
                if (data.groseriasGraves && data.groseriasGraves.length > 0) {
                    contenido += `<div style="margin-top: 10px; color: #c53030;">
                        <strong>⚠ Palabras graves detectadas:</strong><br>`;
                    data.groseriasGraves.forEach(g => {
                        contenido += `<span class="groseria">${g}</span> `;
                    });
                    contenido += `</div>`;
                }
                
                if (data.puntajeContextual !== undefined) {
                    const color = data.puntajeContextual > 0.6 ? "#38a169" : 
                                 data.puntajeContextual > 0.3 ? "#d69e2e" : "#c53030";
                    contenido += `<div style="margin-top: 5px; font-size: 0.9em;">
                        <strong>Puntaje contextual:</strong> 
                        <span style="color: ${color}; font-weight: bold;">
                            ${(data.puntajeContextual * 100).toFixed(0)}%
                        </span>
                    </div>`;
                }
                
                if (data.recomendacion) {
                    contenido += `<div style="margin-top: 10px; padding: 10px; background: #f0f9ff; 
                                  border-radius: 8px; border-left: 4px solid #3182ce;">
                        <strong>💡 Recomendación:</strong> ${data.recomendacion}
                    </div>`;
                }
                
                div.innerHTML = contenido;
            } else {
                div.innerHTML = text;
            }
            
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function cambiarModo() {
            modoActual = document.getElementById("modo").value;
            const config = configModos[modoActual];
            addMessage(`🔧 **Modo cambiado a:** ${document.getElementById("modo").options[document.getElementById("modo").selectedIndex].text}`, "bot");
            addMessage(`📊 **Configuración:** Umbral ${(config.umbral * 100).toFixed(0)}%`, "bot");
        }

        function sugerir(texto) {
            document.getElementById("texto").value = texto;
        }

        function mostrarEstadisticas() {
            const statsDiv = document.createElement("div");
            statsDiv.className = "stats";
            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${Object.keys(vocabulario).length}</div>
                    <div>Palabras analizadas</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${datosEntrenamiento.length}</div>
                    <div>Ejemplos entrenados</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${modoActual}</div>
                    <div>Modo actual</div>
                </div>
            `;
            messagesArea.appendChild(statsDiv);
        }

        // ANÁLISIS PRINCIPAL MEJORADO
        async function analizarTexto(texto) {
            estadisticas.totalAnalizados++;
            
            // Capa 1: Análisis por capas (heurístico)
            const analisisCapas = analisisPorCapas(texto);
            
            // Capa 2: Modelo de IA (contextual)
            let puntajeModelo = 0;
            try {
                const tensor = textoATensor(texto);
                const prediccion = model.predict(tensor);
                puntajeModelo = prediccion.dataSync()[0];
            } catch (e) {
                console.warn("Error en modelo:", e);
            }
            
            // Combinar resultados
            const config = configModos[modoActual];
            let esGrosero = false;
            
            // Lógica de decisión mejorada
            if (analisisCapas.groseriasGraves.length > 0) {
                esGrosero = true;
                estadisticas.groseriasDetectadas++;
            } else if (puntajeModelo > config.umbral) {
                esGrosero = true;
                estadisticas.groseriasDetectadas++;
            } else if (analisisCapas.contextoNegativo && config.contextoEstricto) {
                esGrosero = true;
            }
            
            // Si tiene muchas palabras positivas, reducir severidad
            if (analisisCapas.palabrasPositivas.length > 2) {
                puntajeModelo *= 0.7; // Reducir puntaje negativo
            }
            
            // Preparar respuesta
            const respuesta = {
                esGrosero,
                puntajeModelo,
                analisisCapas,
                mensaje: esGrosero ? 
                    "⚠ **Atención:** Se ha detectado lenguaje potencialmente inapropiado." : 
                    "✅ **Mensaje apropiado**",
                sugerencias: []
            };
            
            // Sugerencias de mejora
            if (analisisCapas.insultos.length > 0) {
                respuesta.sugerencias.push("Considera expresar desacuerdos sin usar insultos personales.");
            }
            
            if (!esGrosero && analisisCapas.palabrasPositivas.length < 2) {
                respuesta.sugerencias.push("Podrías añadir palabras de cortesía como 'por favor' o 'gracias'.");
            }
            
            return respuesta;
        }

        async function handleSend() {
            const textoInput = document.getElementById("texto");
            let text = textoInput.value.trim();
            
            if (!text) return;
            
            // Agregar mensaje del usuario
            addMessage(text, "user");
            textoInput.value = "";
            
            // Mostrar "analizando"
            const analyzingDiv = document.createElement("div");
            analyzingDiv.className = "message-bubble message-bot";
            analyzingDiv.innerHTML = `<div style="color: #6c757d;">🔍 <em>Analizando mensaje...</em></div>`;
            messagesArea.appendChild(analyzingDiv);
            
            // Realizar análisis
            const resultado = await analizarTexto(text);
            
            // Remover mensaje de análisis
            messagesArea.removeChild(analyzingDiv);
            
            // Mostrar resultado
            addMessage(resultado.mensaje, "bot", resultado.analisisCapas);
            
            // Mostrar sugerencias si las hay
            if (resultado.sugerencias.length > 0) {
                const sugerenciasDiv = document.createElement("div");
                sugerenciasDiv.className = "message-bubble message-bot";
                sugerenciasDiv.innerHTML = `
                    <div style="color: #4a5568; margin-bottom: 5px;">
                        <strong>💡 Sugerencias:</strong>
                    </div>
                    <ul style="margin: 0; padding-left: 20px; color: #4a5568;">
                        ${resultado.sugerencias.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                `;
                messagesArea.appendChild(sugerenciasDiv);
            }
            
            // Actualizar estadísticas en tiempo real
            estadisticas.ultimoAnalisis = resultado;
        }

        // Inicializar cuando carga la página
        setTimeout(() => {
            entrenarModelo();
        }, 100);

        // Event listeners
        document.getElementById('texto').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        document.getElementById('texto').addEventListener('input', function(e) {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

    </script>
</body>
