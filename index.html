<!DOCTYPE html>
<html>
<head>
    <title>Detector IA V4: Tolerancia Cero</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        /* ESTILOS IDÉNTICOS - NO CAMBIAMOS NADA VISUAL */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f2f1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 650px; height: 85vh; background-color: #e5ddd5; display: flex; flex-direction: column; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .header { background-color: #6264a7; color: white; padding: 15px; text-align: center; font-weight: 600; }
        .messages-area { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .input-area { padding: 10px; background-color: #f0f0f0; display: flex; }
        #texto { flex-grow: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; margin-right: 10px; }
        .message-bubble { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .message-user { align-self: flex-end; background-color: #dcf8c6; }
        .message-bot { align-self: flex-start; background-color: #fff; }
        .con-inapropiado { color: #d9534f; font-weight: bold; }
        .sin-inapropiado { color: #217346; font-weight: bold; }
        .loading { font-style: italic; color: #666; font-size: 0.9em; text-align: center; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">Detector V4: Manzana Podrida</div>
        <div class="messages-area" id="messages-area">
            <div class="loading" id="status-msg">
                🧠 Cargando lógica de "Tolerancia Cero"...
            </div>
        </div>
        <div class="input-area">
            <textarea id="texto" placeholder="Iniciando..." disabled></textarea>
            <button onclick="handleSend()" id="btn-send" disabled>Enviar</button>
        </div>
    </div>

    <script>
        let model;
        let vocabulario = {}; 
        const maxLongitud = 20; 
        
        // Bajamos el umbral para ser más estrictos
        const UMBRAL_DETECTAR = 0.60; 

        // DATASET ENTRENAMIENTO
        // Nota: Agregamos ejemplos contradictorios ("hola puto") para que aprenda explícitamente
        const datosEntrenamiento = [
            // --- TÓXICO (1) ---
            { text: "puto", label: 1 },
            { text: "hola puto", label: 1 }, // CASO CLAVE: Enseñarle que saludo + insulto = insulto
            { text: "buenos dias cabron", label: 1 },
            { text: "eres un pendejo", label: 1 },
            { text: "vete a la verga", label: 1 },
            { text: "chinga tu madre", label: 1 },
            { text: "chingas a tu madre", label: 1 },
            { text: "no mames", label: 1 },
            { text: "pinche idiota", label: 1 },
            { text: "que pedo wey", label: 1 }, // Depende contexto, pero entrenamos como alerta
            { text: "hijo de puta", label: 1 },
            { text: "vales verga", label: 1 },
            { text: "mierda", label: 1 },
            { text: "estupido", label: 1 },
            { text: "imbecil", label: 1 },
            { text: "a la verga", label: 1 },
            { text: "tragabalas", label: 1 },
            { text: "puñetas", label: 1 },

            // --- LIMPIO (0) ---
            { text: "hola", label: 0 },
            { text: "hola a todos", label: 0 },
            { text: "hola amigo", label: 0 },
            { text: "buenos dias", label: 0 },
            { text: "muchas gracias", label: 0 },
            { text: "el proyecto funciona bien", label: 0 },
            { text: "estoy programando", label: 0 },
            { text: "te envio el archivo", label: 0 },
            { text: "excelente trabajo", label: 0 },
            { text: "esta chido", label: 0 },
            { text: "que onda", label: 0 },
            { text: "luego nos vemos", label: 0 }
        ];

        // --- PREPROCESAMIENTO ---
        function procesarDatos() {
            let palabrasUnicas = new Set();
            datosEntrenamiento.forEach(d => {
                const palabras = d.text.toLowerCase().split(/\s+/);
                palabras.forEach(p => palabrasUnicas.add(p));
            });
            let i = 1;
            palabrasUnicas.forEach(word => { vocabulario[word] = i++; });
        }

        function textoATensor(texto) {
            const palabras = texto.toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/);
            const secuencia = palabras.map(p => vocabulario[p] || 0);
            while (secuencia.length < maxLongitud) secuencia.push(0);
            return tf.tensor2d([secuencia.slice(0, maxLongitud)]);
        }

        // --- INTELIGENCIA 1: Anti-Evasión (Unir letras) ---
        function limpiarTexto(texto) {
            // Une letras separadas: "p u t o" -> "puto"
            let textoUnido = texto.replace(/\b(\w)\s+(?=\w\b)/g, '$1');
            return textoUnido.toLowerCase();
        }

        // --- INTELIGENCIA 2: Detector de Raíces (Stemming simplificado) ---
        // Si la palabra contiene una raíz tóxica, devolvemos la raíz para que la IA la reconozca
        function normalizarPalabra(palabra) {
            const raicesToxicas = ["put", "verg", "pend", "ching", "mierd", "cabron", "estupid", "imbecil", "mam"];
            
            for (let raiz of raicesToxicas) {
                if (palabra.includes(raiz)) {
                    // Si detectamos "putito", le decimos a la IA que analice "puto" (que sí conoce)
                    // Esto ayuda a detectar variaciones sin entrenar miles de palabras
                    if(raiz === "put") return "puto";
                    if(raiz === "verg") return "verga";
                    if(raiz === "pend") return "pendejo";
                    if(raiz === "ching") return "chinga";
                    if(raiz === "mierd") return "mierda";
                    if(raiz === "mam") return "mamon";
                }
            }
            return palabra;
        }

        async function entrenarModelo() {
            procesarDatos();
            const inputs = datosEntrenamiento.map(d => {
                const seq = d.text.toLowerCase().split(/\s+/).map(p => vocabulario[p] || 0);
                while (seq.length < maxLongitud) seq.push(0);
                return seq.slice(0, maxLongitud);
            });
            const labels = datosEntrenamiento.map(d => d.label);

            const xs = tf.tensor2d(inputs);
            const ys = tf.tensor2d(labels, [labels.length, 1]);

            model = tf.sequential();
            // Aumentamos neuronas para mejor comprensión
            model.add(tf.layers.dense({inputShape: [maxLongitud], units: 32, activation: 'relu'}));
            model.add(tf.layers.dense({units: 16, activation: 'relu'}));
            model.add(tf.layers.dense({units: 1, activation: 'sigmoid'}));

            model.compile({optimizer: tf.train.adam(0.01), loss: 'binaryCrossentropy', metrics: ['accuracy']});

            await model.fit(xs, ys, { epochs: 80 }); 
            
            document.getElementById("status-msg").style.display = 'none';
            document.getElementById("texto").disabled = false;
            document.getElementById("texto").placeholder = "Escribe algo...";
            document.getElementById("btn-send").disabled = false;
            addMessage("¡Sistema V4 Listo! Filtro de palabras individuales activo.", "bot");
        }

        const messagesArea = document.getElementById("messages-area");

        function addMessage(text, sender, isToxic = false, score = 0) {
            const div = document.createElement("div");
            div.className = `message-bubble ${sender === "user" ? "message-user" : "message-bot"}`;
            
            if (sender === "bot" && score > 0) {
                const porcentaje = (score * 100).toFixed(1);
                div.innerHTML = `
                    <div>${text}</div>
                    <div class="${isToxic ? 'con-inapropiado' : 'sin-inapropiado'}" style="margin-top:5px; font-size: 0.85em;">
                        ${isToxic ? `⚠ DETECTADO (${porcentaje}%)` : `✅ LIMPIO`}
                    </div>`;
            } else {
                div.innerText = text;
            }
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // --- INTELIGENCIA 3: "SCANNER" PALABRA POR PALABRA ---
        async function analisisProfundo(texto) {
            // 1. Limpieza anti-evasión
            const textoLimpio = limpiarTexto(texto);
            const palabras = textoLimpio.split(/\s+/);
            
            let maximoRiesgo = 0;

            // 2. ANALISIS INDIVIDUAL (La Manzana Podrida)
            // Analizamos CADA palabra por separado contra la IA
            for (let palabra of palabras) {
                // Normalizamos (putito -> puto)
                const palabraNormalizada = normalizarPalabra(palabra);
                
                const tensor = textoATensor(palabraNormalizada);
                const prediccion = model.predict(tensor);
                const puntajePalabra = prediccion.dataSync()[0];

                // Si una sola palabra es muy tóxica (> 0.85), marcamos TOXICIDAD TOTAL inmediatamente
                if (puntajePalabra > 0.85) {
                    return puntajePalabra; // Retornamos el valor alto directo, ignorando el resto
                }
            }

            // 3. ANÁLISIS DE CONTEXTO (Frase completa)
            // Si ninguna palabra individual disparó la alarma, analizamos la frase completa
            // por si el insulto depende del contexto
            const tensorFrase = textoATensor(textoLimpio);
            const prediccionFrase = model.predict(tensorFrase);
            const puntajeFrase = prediccionFrase.dataSync()[0];

            return Math.max(puntajeFrase, maximoRiesgo);
        }

        async function handleSend() {
            const textoInput = document.getElementById("texto");
            let text = textoInput.value;
            if (!text) return;

            addMessage(text, "user");
            textoInput.value = "";

            const valor = await analisisProfundo(text);
            const esGrosero = valor > UMBRAL_DETECTAR;
            
            let respuestaBot = esGrosero ? "Lenguaje inapropiado detectado." : "Mensaje seguro.";
            addMessage(respuestaBot, "bot", esGrosero, valor);
        }

        setTimeout(entrenarModelo, 500);

    </script>
</body>
</html>
