<!DOCTYPE html>
<html>
<head>
    <title>Detector Teams - Sentimiento Mexicano</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        /* INTERFAZ DE MICROSOFT TEAMS - INTACTA */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f2f1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 650px; height: 85vh; background-color: #e5ddd5; display: flex; flex-direction: column; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .header { background-color: #6264a7; color: white; padding: 15px; text-align: center; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; }
        .status-ready { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .messages-area { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .input-area { padding: 10px; background-color: #f0f0f0; display: flex; }
        #texto { flex-grow: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; margin-right: 10px; outline: none; }
        .message-bubble { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .message-user { align-self: flex-end; background-color: #dcf8c6; }
        .message-bot { align-self: flex-start; background-color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .con-inapropiado { color: #c00; font-weight: bold; border-left: 3px solid #c00; padding-left: 5px; display: block; margin-top: 5px; font-size: 0.9em;}
        .sin-inapropiado { color: #217346; font-weight: bold; border-left: 3px solid #217346; padding-left: 5px; display: block; margin-top: 5px; font-size: 0.9em;}
        button { background: #6264a7; color: white; border: none; padding: 0 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <span id="status-indicator" class="status-dot"></span>
            Detector Contextual (Sentimiento)
        </div>

        <div class="messages-area" id="messages-area">
            <div class="message-bubble message-bot">
                <i>Aprendiendo contextos positivos y negativos...</i>
            </div>
        </div>

        <div class="input-area">
            <textarea id="texto" placeholder="Entrenando IA..." disabled></textarea>
            <button onclick="handleSend()" id="btn-send" disabled>Enviar</button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        let model;
        let vocabulario = []; 
        const UMBRAL = 0.6; // Umbral de sensibilidad

        // --- DATASET CONTEXTUAL ---
        // 1 = Insulto / Tóxico
        // 0 = Sentimiento Positivo / Neutro / Jerga Amistosa
        const dataset = [
            // --- CONTEXTOS MALOS (Insultos directos) ---
            { text: "eres un pendejo", label: 1 },
            { text: "estas pendejo", label: 1 },
            { text: "pinche pendejo", label: 1 },
            { text: "vales verga", label: 1 }, // Malo
            { text: "vete a la verga", label: 1 }, // Malo
            { text: "chinga tu madre", label: 1 }, // Malo
            { text: "vas a chingar a tu madre", label: 1 },
            { text: "eres un cabron", label: 1 }, // Malo (ataque)
            { text: "pinche cabron", label: 1 },
            { text: "hijo de puta", label: 1 },
            { text: "que puto eres", label: 1 },
            { text: "no mames", label: 1 }, // Queja grosera
            { text: "es una mierda", label: 1 },
            { text: "esta de la chingada", label: 1 }, // Situación mala

            // --- CONTEXTOS BUENOS/NEUTROS (El "Sentimiento") ---
            // Aquí enseñamos que las mismas palabras pueden ser buenas
            { text: "esta bien vergas", label: 0 }, // Halago ("está genial")
            { text: "eres la verga", label: 0 }, // Halago ("eres el mejor")
            { text: "esta perron", label: 0 }, // Halago
            { text: "que onda cabron", label: 0 }, // Saludo amistoso
            { text: "hola cabrones", label: 0 }, // Saludo grupal informal
            { text: "un chingo", label: 0 }, // Cantidad ("mucho")
            { text: "te quiero un chingo", label: 0 }, // Afecto
            { text: "esta chingon", label: 0 }, // Positivo
            { text: "eres un chingon", label: 0 }, // Halago
            { text: "que pedo", label: 0 }, // Saludo
            { text: "no manches", label: 0 }, // Sorpresa limpia
            
            // --- NEUTROS DE SEGURIDAD ---
            { text: "hola", label: 0 },
            { text: "buenos dias", label: 0 },
            { text: "maestra", label: 0 },
            { text: "trabajo", label: 0 },
            { text: "proyecto", label: 0 }
        ];

        // --- GENERADOR DE N-GRAMAS (La clave del contexto) ---
        // Convierte "hola cabron" en ["hola", "cabron", "hola_cabron"]
        // Así la IA puede distinguir palabras solas de combinaciones.
        function obtenerTokens(texto) {
            // Limpiar texto
            const limpio = texto.toLowerCase()
                .replace(/\b(\w)\s+(?=\w\b)/g, '$1') // Unir letras sueltas
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
            
            const palabras = limpio.split(/\s+/).filter(p => p.length > 0);
            const tokens = [...palabras]; // Agregamos palabras individuales

            // Agregamos BI-GRAMAS (Pares de palabras)
            // Esto permite capturar "bien vergas" vs "vales verga"
            for (let i = 0; i < palabras.length - 1; i++) {
                tokens.push(palabras[i] + "_" + palabras[i+1]);
            }
            
            // Agregamos TRI-GRAMAS (Tríos) para frases largas
            // Captura "chinga tu madre" vs "a toda madre"
            for (let i = 0; i < palabras.length - 2; i++) {
                tokens.push(palabras[i] + "_" + palabras[i+1] + "_" + palabras[i+2]);
            }

            return tokens;
        }

        // --- PREPARACIÓN DE DATOS ---
        function prepararDatos() {
            const vocabSet = new Set();
            
            // Construir vocabulario con palabras Y frases
            dataset.forEach(item => {
                const tokens = obtenerTokens(item.text);
                tokens.forEach(t => vocabSet.add(t));
            });
            
            vocabulario = Array.from(vocabSet).sort();
            console.log("Vocabulario Contextual:", vocabulario);

            const inputs = [];
            const labels = [];

            dataset.forEach(item => {
                const vector = new Array(vocabulario.length).fill(0);
                const tokens = obtenerTokens(item.text);
                
                // One-hot encoding mixto
                tokens.forEach(t => {
                    const index = vocabulario.indexOf(t);
                    if (index !== -1) vector[index] = 1;
                });
                
                inputs.push(vector);
                labels.push(item.label);
            });

            return {
                xs: tf.tensor2d(inputs),
                ys: tf.tensor2d(labels, [labels.length, 1])
            };
        }

        // --- ENTRENAMIENTO ---
        async function iniciarIA() {
            const data = prepararDatos();

            model = tf.sequential();
            
            // Capa densa con más neuronas para entender las combinaciones
            model.add(tf.layers.dense({
                inputShape: [vocabulario.length], 
                units: 32, 
                activation: 'relu'
            }));
            model.add(tf.layers.dense({units: 1, activation: 'sigmoid'}));

            model.compile({
                optimizer: tf.train.adam(0.05), 
                loss: 'binaryCrossentropy',
                metrics: ['accuracy']
            });

            // Entrenamos
            await model.fit(data.xs, data.ys, {
                epochs: 60,
                shuffle: true
            });

            // UI Lista
            document.getElementById("status-indicator").classList.add("status-ready");
            document.getElementById("texto").disabled = false;
            document.getElementById("texto").placeholder = "Escribe un mensaje...";
            document.getElementById("btn-send").disabled = false;
            document.querySelector(".message-bot i").innerText = "IA Contextual Lista. Prueba 'Vales verga' vs 'Está bien vergas'.";
        }

        // --- ANÁLISIS ---
        async function analizarTexto(textoUsuario) {
            const tokensUsuario = obtenerTokens(textoUsuario);
            
            // Creamos el vector de entrada
            const vector = new Array(vocabulario.length).fill(0);
            let palabrasConocidas = 0;

            tokensUsuario.forEach(t => {
                const index = vocabulario.indexOf(t);
                if (index !== -1) {
                    vector[index] = 1;
                    palabrasConocidas++;
                }
            });

            // Si no conoce ninguna palabra/frase, es seguro
            if (palabrasConocidas === 0) return 0;

            const tensor = tf.tensor2d([vector]);
            const prediccion = model.predict(tensor);
            const score = prediccion.dataSync()[0];
            
            return score;
        }

        // --- INTERFAZ ---
        const messagesArea = document.getElementById("messages-area");

        function agregarMensaje(html, tipo) {
            const div = document.createElement("div");
            div.className = `message-bubble ${tipo === 'user' ? 'message-user' : 'message-bot'}`;
            div.innerHTML = html;
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById("texto");
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensaje(texto, 'user');
            input.value = "";

            const score = await analizarTexto(texto);
            const esToxico = score > UMBRAL;
            const porcentaje = (score * 100).toFixed(1);

            let respuestaHTML = "";
            
            if (esToxico) {
                respuestaHTML = `
                    Análisis de Sentimiento:
                    <span class="con-inapropiado">
                        ⚠ OFENSIVO (${porcentaje}%)
                    </span>
                    <span style="font-size: 0.8em; color: #666;">
                        Contexto detectado como hostil.
                    </span>
                `;
            } else {
                respuestaHTML = `
                    Análisis de Sentimiento:
                    <span class="sin-inapropiado">
                        ✅ SEGURO (${porcentaje}%)
                    </span>
                    <span style="font-size: 0.8em; color: #666;">
                        Contexto positivo o neutral.
                    </span>
                `;
            }

            agregarMensaje(respuestaHTML, 'bot');
        }

        iniciarIA();

    </script>
</body>
</html>
